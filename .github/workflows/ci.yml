name: YaroServer CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: yaroserver-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verification tests
        run: npm run test:verification

      - name: Moderation tests
        run: npm run test:moderation

      - name: Risk tests
        run: npm run test:risk

      - name: Referral tests
        run: npm run test:referral
