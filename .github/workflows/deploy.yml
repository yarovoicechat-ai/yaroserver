name: YaroServer Production Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: yaroserver-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, Test & Deploy YaroServer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verification tests
        run: npm run test:verification

      - name: Moderation tests
        run: npm run test:moderation

      - name: Risk tests
        run: npm run test:risk

      - name: Referral tests
        run: npm run test:referral

      - name: Deploy to Contabo
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script_stop: false
          script: |
            echo "========================================"
            echo "       YARO SERVER PRODUCTION DEPLOY"
            echo "========================================"
            echo "GitHub Commit: ${{ github.sha }}"
            echo "GitHub Branch: ${{ github.ref_name }}"
            echo "Deployment started: $(date)"

            # 0. Ensure 2GB swap space exists
            if ! swapon --show | grep -q "/swapfile"; then
              echo "Creating 2GB swapfile..."
              fallocate -l 2G /swapfile 2>/dev/null || dd if=/dev/zero of=/swapfile bs=1M count=2048
              chmod 600 /swapfile
              mkswap /swapfile
              swapon /swapfile || true
            fi

            # 1. Update Nginx client_max_body_size to 300M globally & for all virtual hosts
            echo "=== Configuring Nginx client_max_body_size to 300M ==="
            if [ -f /etc/nginx/nginx.conf ]; then
              if grep -q "client_max_body_size" /etc/nginx/nginx.conf; then
                sed -i 's/client_max_body_size .*/client_max_body_size 300M;/' /etc/nginx/nginx.conf
              else
                sed -i '/http {/a \    client_max_body_size 300M;' /etc/nginx/nginx.conf
              fi
            fi

            for conf in /etc/nginx/sites-available/* /etc/nginx/sites-enabled/* /etc/nginx/conf.d/*; do
              if [ -f "$conf" ]; then
                if grep -q "client_max_body_size" "$conf"; then
                  sed -i 's/client_max_body_size .*/client_max_body_size 300M;/' "$conf"
                fi
              fi
            done

            echo "=== Nginx Upstream Inspection for api.yaroapp.in ==="
            grep -rn "api.yaroapp.in" /etc/nginx/ -A 30 2>/dev/null || true

            # 2. Locate backend directory
            echo "=== Locating Backend Directory ==="
            BACKEND_DIR=""
            for dir in /root/apps/Yaro/YaroServer /root/apps/YaroServer /root/apps/yaro-server /root/apps/backend /var/www/yaro-server; do
              if [ -d "$dir" ] && [ -f "$dir/package.json" ]; then
                BACKEND_DIR="$dir"
                break
              fi
            done

            if [ -z "$BACKEND_DIR" ]; then
              BACKEND_DIR=$(find /root/apps /root/deployments /var/www -name "src" -type d 2>/dev/null | grep -i "server" | head -1 | xargs -r dirname)
            fi

            echo "Target backend directory: $BACKEND_DIR"

            if [ -n "$BACKEND_DIR" ] && [ -d "$BACKEND_DIR" ]; then
              cd "$BACKEND_DIR"
              echo "Pulling latest code in $BACKEND_DIR..."
              git fetch origin main || true
              git reset --hard origin/main || true
              echo "Installing dependencies..."
              npm install --no-audit --no-fund || true
              echo "Compiling TypeScript..."
              npm run build || true
            fi

            # 3. Clean up port 3101 and old PM2 processes
            echo "=== PM2 Process Management ==="
            fuser -k 3101/tcp 2>/dev/null || true
            pm2 delete yaro-backend-cluster 2>/dev/null || true
            pm2 delete yaro-backend 2>/dev/null || true
            pm2 delete yaro-server 2>/dev/null || true

            if [ -n "$BACKEND_DIR" ] && [ -d "$BACKEND_DIR" ]; then
              cd "$BACKEND_DIR"
              PORT=3101 NODE_ENV=production pm2 start dist/index.js --name yaro-backend --update-env
              pm2 save || true
            fi

            sleep 5
            echo "=== PM2 Status ==="
            pm2 list

            echo "=== Local Port 3101 Test ==="
            curl -sv http://127.0.0.1:3101/health || curl -sv http://127.0.0.1:3101/ || true

            echo "=== PM2 Backend Stdout Logs ==="
            pm2 logs yaro-backend --lines 30 --nostream 2>&1 || true

            echo "=== PM2 Backend Error Logs ==="
            tail -n 30 /root/.pm2/logs/yaro-backend-error.log 2>/dev/null || true

            echo "=== Testing & Reloading Nginx ==="
            nginx -t && (systemctl reload nginx || service nginx reload || true)

            echo "=== Public API Health Test ==="
            curl -sv https://api.yaroapp.in/health || curl -sv https://api.yaroapp.in/ || true

            echo "========================================"
            echo "       DEPLOYMENT COMPLETED"
            echo "========================================"
            echo "Deployment finished: $(date)"
