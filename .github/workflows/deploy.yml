name: YaroServer Production Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: yaroserver-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, Test & Deploy YaroServer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verification tests
        run: npm run test:verification

      - name: Moderation tests
        run: npm run test:moderation

      - name: Risk tests
        run: npm run test:risk

      - name: Referral tests
        run: npm run test:referral

      - name: Room notification and call-token regression tests
        run: node --test src/tests/roomNotificationHotfix.test.cjs

      - name: Deploy to Contabo
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script_stop: false
          script: |
            set -eu
            echo "DEPLOY_STAGE=runtime-discovery"
            pm2 jlist | node -e 'const ps=JSON.parse(require("fs").readFileSync(0,"utf8")); console.log(JSON.stringify(ps.filter(p=>/^yaro/i.test(p.name)).map(p=>({name:p.name,cwd:p.pm2_env.pm_cwd}))))'
            BACKEND_DIR=""
            for dir in /root/apps/Yaro/YaroServer /root/apps/YaroServer /root/apps/yaro-server /root/apps/backend /var/www/yaro-server; do
              if [ -f "$dir/package.json" ]; then BACKEND_DIR="$dir"; break; fi
            done
            echo "DEPLOY_TARGET=$BACKEND_DIR"
            test -n "$BACKEND_DIR"
            cd "$BACKEND_DIR"
            echo "DEPLOY_BRANCH=$(git branch --show-current)"
            test "$(git branch --show-current)" = main
            echo "DEPLOY_STAGE=check-production-edits"
            git diff --name-only
            git diff --quiet
            git diff --cached --quiet
            echo "DEPLOY_STAGE=fetch"
            git fetch origin main
            test "$(git rev-parse origin/main)" = '${{ github.sha }}'
            BACKUP_DIR="$HOME/yaro-deploy-backups/$(date +%Y%m%d-%H%M%S)"
            mkdir -p "$BACKUP_DIR"
            git rev-parse HEAD > "$BACKUP_DIR/previous-commit"
            tar -czf "$BACKUP_DIR/backend.tgz" src dist package.json package-lock.json
            rollback() {
              trap - EXIT
              tar -xzf "$BACKUP_DIR/backend.tgz"
              pm2 reload yaro-backend --update-env || true
              echo "Deployment failed; restored previous backend from $BACKUP_DIR"
              exit 1
            }
            trap rollback EXIT
            git merge --ff-only origin/main
            npm ci --no-audit --no-fund
            npm run build
            pm2 reload yaro-backend --update-env
            sleep 5
            curl --fail --silent --show-error --retry 5 --retry-delay 2 http://127.0.0.1:3101/health
            curl --fail --silent --show-error --retry 5 --retry-delay 2 https://api.yaroapp.in/health
            pm2 save
            trap - EXIT
            echo "DEPLOYED_COMMIT=${{ github.sha }}"
