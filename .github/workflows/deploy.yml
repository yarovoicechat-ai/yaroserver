name: YaroServer Production Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: yaroserver-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, Test & Deploy YaroServer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verification tests
        run: npm run test:verification

      - name: Moderation tests
        run: npm run test:moderation

      - name: Risk tests
        run: npm run test:risk

      - name: Referral tests
        run: npm run test:referral

      - name: Deploy to Contabo
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script_stop: true

          script: |
            set -uo pipefail

            echo "========================================"
            echo "       YARO SERVER PRODUCTION DEPLOY"
            echo "========================================"
            echo "GitHub Commit: ${{ github.sha }}"
            echo "GitHub Branch: ${{ github.ref_name }}"
            echo "Deployment started: $(date)"

            if [ -f /root/deployments/yaro-server/deploy-yaro-server.sh ]; then
              sed -i 's/--force//g' /root/deployments/yaro-server/deploy-yaro-server.sh || true
              sed -i 's/pm2 reload/pm2 reload --force/g' /root/deployments/yaro-server/deploy-yaro-server.sh || true
              /root/deployments/yaro-server/deploy-yaro-server.sh || true
            fi

            # Ensure yaro-server process is restarted and running
            pm2 restart yaro-server --update-env || pm2 reload yaro-server --force || pm2 restart all --force
            sleep 3
            pm2 status

            echo "========================================"
            echo "       DEPLOYMENT COMPLETED"
            echo "========================================"
            echo "Deployment finished: $(date)"
