name: YaroServer Production Deploy

on:
  workflow_run:
    workflows:
      - YaroServer CI
    types:
      - completed
    branches:
      - main

concurrency:
  group: yaroserver-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy YaroServer
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Contabo
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22

          script: |
            set -euo pipefail

            echo "===== YARO SERVER DEPLOYMENT ====="
            echo "CI Commit: ${{ github.event.workflow_run.head_sha }}"
            echo "CI Branch: ${{ github.event.workflow_run.head_branch }}"

            /root/deployments/yaro-server/deploy-yaro-server.sh

            echo "===== DEPLOYMENT COMPLETE ====="
